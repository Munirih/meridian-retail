name: Provision EC2 (one-time / rebuild only)

# Manual trigger only —This runs whensetting up a brand new instance, or if you ever rebuild one fromscratch. 
# Safe to re-run against an already-provisioned instance
# (server_setup.sh's installs are idempotent, and the nginx/certbot
# steps below are also idempotent now — ln -sf, rm -f, and certbot
# reusing an existing valid cert rather than erroring).
on:
  workflow_dispatch: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get server public IP by tag
        run: |
          EC2_INSTANCE=$(aws ec2 describe-instances \
            --region ${{ secrets.AWS_REGION }} \
            --filters "Name=tag:Name,Values=meridian-retail-server" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          if [ -z "$EC2_INSTANCE" ] || [ "$EC2_INSTANCE" == "None" ]; then
            echo "No running instance found with tag Name=meridian-retail-server"
            exit 1
          fi
          echo "EC2_INSTANCE=$EC2_INSTANCE" >> "$GITHUB_ENV"

      - name: Get Security Group ID
        run: |
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups \
          --region ${{ secrets.AWS_REGION }} \
          --filters "Name=tag:Name,Values=meridian-retail-server-sg-sg" \
          --query 'SecurityGroups[0].GroupId' \
          --output text)

          if [ -z "$SECURITY_GROUP_ID" ] || [ "$SECURITY_GROUP_ID" = "None" ]; then
            echo "Security group not found"
            exit 1
          fi

          echo "Security Group ID: $SECURITY_GROUP_ID"
          echo "SECURITY_GROUP_ID=$SECURITY_GROUP_ID" >> "$GITHUB_ENV"

      - name: Get GitHub runner IP
        id: runner-ip
        run: |
          echo "ip=$(curl -s https://ipv4.icanhazip.com)" >> "$GITHUB_OUTPUT"

      - name: Allow GitHub runner SSH
        run: |
          aws ec2 authorize-security-group-ingress \
          --group-id ${{ env.SECURITY_GROUP_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.runner-ip.outputs.ip }}/32

      - name: Copy scripts folder to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.EC2_INSTANCE }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./scripts"
          target: "/home/${{ secrets.EC2_USERNAME }}/app"

      - name: Copy nginx folder to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.EC2_INSTANCE }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./nginx"
          target: "/home/${{ secrets.EC2_USERNAME }}/app"

      - name: Run server_setup.sh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_INSTANCE }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USERNAME }}/app/scripts
            chmod +x *.sh
            sudo ./server_setup.sh

      - name: Install nginx config
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_INSTANCE }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USERNAME }}/app/nginx
            sudo cp meridian-http.conf /etc/nginx/sites-available/meridian-http.conf
            sudo ln -sf /etc/nginx/sites-available/meridian-http.conf /etc/nginx/sites-enabled/meridian-http.conf
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Run certbot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_INSTANCE }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOMAIN
          script: |
            set -e
            sudo certbot --nginx \
              -d "$DOMAIN" \
              -d "www.$DOMAIN" \
              --non-interactive \
              --agree-tos \
              --redirect \
              -m "${{ secrets.CERTBOT_EMAIL }}"

            sudo certbot renew --dry-run
        env:
          DOMAIN: ${{ secrets.DOMAIN }}

      - name: Remove GitHub runner SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
          --group-id ${{ env.SECURITY_GROUP_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.runner-ip.outputs.ip }}/32
